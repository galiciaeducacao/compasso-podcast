# COMPASSO CAPITAL — o guardiao decide se o rascunho de HOJE pode ir ao ar.
#
# O Paulo dispensou a aprovacao manual. Isso significa que este workflow e a UNICA
# coisa entre o modelo e o ar, num programa diario que fala em nome de tres marcas
# pagantes. A regua e dura de proposito: na duvida, barra.
#
# Roda as 3h30 da madrugada, meia hora antes da gravacao das 4h (regra do Paulo, 04/09/2026:
# o roteiro e escrito as 3h do proprio dia, com as noticias conferidas contra o que saiu
# depois das 14h da vespera; escrever na tarde anterior deixou o Datafolha das 19h de fora).
# Se reprovar, ABRE UMA ISSUE explicando o motivo. O GitHub notifica por e-mail, e
# assim um dia sem episodio nunca acontece em silencio: silencio e pior que erro
# conhecido, porque ninguem investiga o que nao viu.

name: guardiao (3h30)

on:
  schedule:
    - cron: '30 6 * * *'      # 3h30 de Brasilia
    - cron: '45 6 * * *'      # 3h45, se o primeiro nao rodar
    - cron: '0 7 * * *'       # 4h00, ultima tentativa, junto com a gravacao
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do rascunho a avaliar (AAAA-MM-DD). Vazio = hoje'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  avaliar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Definir a data
        id: alvo
        run: |
          DATA="${{ inputs.data }}"
          [ -z "$DATA" ] && DATA=$(TZ=America/Sao_Paulo date +%F)
          echo "data=$DATA" >> $GITHUB_OUTPUT

      - name: Passar a regua
        id: reguar
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: python scripts/guardiao.py "${{ steps.alvo.outputs.data }}"

      - name: Promover o rascunho aprovado
        if: steps.reguar.outputs.aprovado == 'sim'
        run: |
          git config user.name "COMPASSO"
          git config user.email "contato@compasso.capital"
          git commit -qm "aprovado pelo guardiao: ${{ steps.alvo.outputs.data }}"
          git push
          echo "::notice::Roteiro de ${{ steps.alvo.outputs.data }} aprovado e promovido."

      - name: Avisar que hoje nao tem episodio, e por que
        if: steps.reguar.outputs.aprovado == 'nao'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Sem episodio em ${{ steps.alvo.outputs.data }}: o guardiao barrou" \
            --body "$(cat <<FIM
          O rascunho de **${{ steps.alvo.outputs.data }}** nao passou na regua e **nao vai ao ar**.

          ### O que barrou

          ${{ steps.reguar.outputs.motivos }}

          ### O que fazer

          Corrigir \`roteiros/rascunhos/${{ steps.alvo.outputs.data }}.md\` e rodar de novo:

              gh workflow run guardiao.yml -f data=${{ steps.alvo.outputs.data }}

          Se o motivo for numero sem lastro, confira contra as cinco analises da VESPERA
          (o episodio de um dia comenta as analises publicadas no dia anterior). **Numero que
          nao esta na apuracao nao pode ir ao ar**, mesmo que pareca certo.
          FIM
          )"

      # Dia sem roteiro nenhum e a falha mais provavel e a mais silenciosa da esteira:
      # nada quebra, nada estoura, so nao sai episodio. Aviso obrigatorio.
      - name: Avisar que nao existe roteiro para hoje
        if: steps.reguar.outputs.faltando == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "SEM ROTEIRO para ${{ steps.alvo.outputs.data }}: nao havera episodio" --body "Nao existe **nem roteiro aprovado nem rascunho** para ${{ steps.alvo.outputs.data }}. Se nada for feito ate as 4h, **nao havera episodio nesse dia**.

          A causa mais provavel e a rotina das 3h nao ter rodado, ou nao ter achado a
          apuracao do dia em \`galicia/compasso/ops/diarias/\`.

          Para resolver, na ordem:

          1. conferir a rotina em https://claude.ai/code/routines
          2. se a apuracao do dia existir, rodar a rotina a mao por la
          3. com o rascunho escrito: \`gh workflow run guardiao.yml -f data=${{ steps.alvo.outputs.data }}\`
          4. e depois: \`gh workflow run gerar-audio.yml -f data=${{ steps.alvo.outputs.data }}\`

          A gravacao roda as 4h, 4h15 e 4h30, e a publicacao as 5h."

      - name: Avisar que a regua aprovou
        if: steps.reguar.outputs.aprovado == 'sim'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py regua ok "O roteiro de ${{ steps.alvo.outputs.data }} passou em todas as travas e seguiu para a gravacao das 4h."

      - name: Avisar que a regua barrou
        if: steps.reguar.outputs.aprovado == 'nao'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py regua falhou "O roteiro de ${{ steps.alvo.outputs.data }} foi BARRADO e nao vai ao ar sem correcao. Motivos: ${{ steps.reguar.outputs.motivos }}"

      - name: Avisar que nao ha roteiro nenhum
        if: steps.reguar.outputs.faltando == 'sim'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py roteiro falhou "Nao existe roteiro NEM rascunho para ${{ steps.alvo.outputs.data }}. A escrita das 3h nao entregou. Sem acao, hoje o programa nao sai."
