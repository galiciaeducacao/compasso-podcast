# COMPASSO CAPITAL — poe o episodio no feed as 5h da manha.
#
# O audio ja esta no ar desde as 18h da vespera, como release. O que este workflow faz
# e acrescenta-lo ao FEED, e e isso que faz o episodio existir para o mundo: o Spotify,
# a Apple e os demais so enxergam o que esta no feed.
#
# POR QUE 5h E NAO 6h45. O compromisso com o ouvinte continua sendo 7h, e o pubDate
# gravado no feed continua sendo 07:00. O que mudou e a hora de ENTRADA: entrar as 6h45
# nao deixa margem para o agregador ler o feed e baixar o audio antes das 7h, porque
# quem decide a hora da leitura e ele, nao nos. Duas horas de folga cobrem esse atraso
# sem mexer no horario anunciado.
#
# TRES HORARIOS, nao um: em 28/08 este workflow simplesmente NAO RODOU no horario
# agendado. Para um programa diario, um unico disparo nao serve. Como o passo so age
# havendo pendente, disparo repetido nao publica duas vezes.
#
# Quem manda na hora de verdade e a rotina de nuvem, que faz push em ops/publicar-agora.txt
# e dispara este workflow NA HORA. O cron abaixo e so a rede de baixo, porque o
# agendador do GitHub entrega com horas de atraso. O nome do arquivo e historico.
#
# Se nao houver episodio pendente, sai sem fazer nada.

name: publicar no feed (5h)

on:
  schedule:
    - cron: '0 8 * * *'       # 5h00 de Brasilia
    - cron: '20 8 * * *'      # 5h20, se o primeiro nao rodar
    - cron: '40 8 * * *'      # 5h40, ultima tentativa
  push:
    paths: ['ops/publicar-agora.txt']   # gatilho pontual: o cron do GitHub atrasa horas
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do episodio a publicar (AAAA-MM-DD). Vazio = hoje'
        required: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # O alvo NAO e "a data de hoje". Se o disparo atrasar e atravessar a meia-noite,
      # procurar por hoje erra o arquivo, o pendente fica encalhado e o episodio nunca
      # vai ao ar: falha silenciosa no elo que decide se o programa existe.
      # Entao: o pendente mais ANTIGO cuja data ja chegou. Disparo atrasado ainda acerta.
      - name: Ha episodio esperando para entrar no feed?
        id: check
        run: |
          if [ -n "${{ inputs.data }}" ]; then
            DATA="${{ inputs.data }}"
          else
            DATA=$(python -c "
          import datetime as dt, pathlib, re
          hoje = dt.datetime.now(dt.timezone(dt.timedelta(hours=-3))).date()
          p = pathlib.Path('pendentes')
          datas = sorted(x.stem for x in p.glob('*.json')
                         if re.fullmatch(r'\d{4}-\d{2}-\d{2}', x.stem)
                         and dt.date.fromisoformat(x.stem) <= hoje) if p.exists() else []
          print(datas[0] if datas else '')")
          fi
          echo "data=$DATA" >> $GITHUB_OUTPUT
          if [ -n "$DATA" ] && [ -f "pendentes/$DATA.json" ]; then
            echo "tem=sim" >> $GITHUB_OUTPUT
            echo "Publicando o episodio de $DATA"
          else
            echo "tem=nao" >> $GITHUB_OUTPUT
            echo "::notice::Nenhum episodio esperando publicacao."
          fi

      # A URL CONFERIDA TEM QUE SER A MESMA QUE VAI PARA O FEED. Quem escolhe e
      # publicar_feed.acrescentar(), pela presenca de R2_BUCKET no ambiente. Conferir
      # aqui o release enquanto o feed publica o R2 seria conferir o arquivo errado --
      # e passaria, porque o release responde 200 de qualquer jeito.
      #
      # E 200 NAO BASTA. O release respondia 200 o tempo todo e mesmo assim o episodio
      # nao tocava na Apple, porque vinha como octet-stream com attachment. O que
      # decide se toca e o Content-Type.
      - name: Conferir que o audio esta mesmo no ar
        if: steps.check.outputs.tem == 'sim'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          URL=$(python -c "
          import json, os
          n = json.load(open('pendentes/${{ steps.check.outputs.data }}.json'))['numero']
          arq = 'compasso-capital-%04d.mp3' % n
          print('https://audio.compasso.capital/' + arq if os.environ.get('R2_BUCKET')
                else 'https://github.com/${{ github.repository }}/releases/download/ep%04d/%s' % (n, arq))")
          CODE=$(curl -sIL -o /dev/null -w "%{http_code}" "$URL")
          TIPO=$(curl -sIL -o /dev/null -w "%{content_type}" "$URL")
          echo "audio em $URL responde $CODE, Content-Type: $TIPO"
          # publicar no feed um audio que nao baixa quebraria o episodio em todos os tocadores
          [ "$CODE" = "200" ] || { echo "::error::Audio inacessivel. Publicacao abortada."; exit 1; }
          case "$TIPO" in
            audio/mpeg*) echo "::notice::Servido como audio: toca na Apple e no Spotify." ;;
            *) echo "::warning::Content-Type $TIPO, esperado audio/mpeg. O episodio vai ao ar, mas a Apple provavelmente recusa. Conferir o R2." ;;
          esac

      # R2_BUCKET PRECISA ESTAR AQUI, e nao so no workflow das 18h. E este passo que
      # chama acrescentar(), e e acrescentar() que decide se o enclosure aponta para
      # audio.compasso.capital ou para o release. Sem esta variavel o audio subiria
      # para o R2 toda noite e o feed continuaria mandando a Apple no release: o
      # problema seguiria de pe, em silencio, com tudo aparentemente configurado.
      - name: Acrescentar ao feed e publicar
        if: steps.check.outputs.tem == 'sim'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'FIM'
          import json, pathlib, subprocess, sys
          data = "${{ steps.check.outputs.data }}"
          p = json.loads(pathlib.Path(f"pendentes/{data}.json").read_text(encoding="utf-8"))
          roteiro = pathlib.Path(f"roteiros/{data}.md").read_text(encoding="utf-8")

          # titulo e resumo saem do proprio roteiro: primeira linha de titulo e a chamada
          titulo = f"{p['numero']}. " + next(
              (l.lstrip('# ').strip() for l in roteiro.splitlines()
               if l.startswith('# ') and 'COMPASSO' not in l.upper()),
              f"Episodio {p['numero']}")
          resumo = next((l.strip() for l in roteiro.splitlines()
                         if l.strip().startswith('> RESUMO:')), "")
          resumo = resumo.replace("> RESUMO:", "").strip() or \
                   "Cinco noticias que a imprensa brasileira nao conta direito. compasso.capital"

          subprocess.run([sys.executable, "scripts/publicar_feed.py", "--acrescentar",
                          str(p["numero"]), titulo, resumo, p["duracao"],
                          str(p["tamanho"]), f"{data}T07:00:00"], check=True)
          FIM
          git config user.name "COMPASSO"
          git config user.email "contato@compasso.capital"
          git rm -q "pendentes/${{ steps.check.outputs.data }}.json"
          git add feed.xml scripts/episodios.json
          git commit -m "no ar: episodio de ${{ steps.check.outputs.data }}"
          git push

      - name: Confirmar que o feed publicado ja tem o episodio
        if: steps.check.outputs.tem == 'sim'
        run: |
          sleep 60
          for i in 1 2 3 4 5 6; do
            if curl -s "https://galiciaeducacao.github.io/compasso-podcast/feed.xml" | grep -q "$(python -c "import json;print(json.load(open('scripts/episodios.json'))['episodios'][0]['guid'])")"; then
              echo "::notice::Episodio no ar no feed publico."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::O feed ainda nao propagou. Costuma resolver sozinho em minutos."

      # Em dia sem episodio pendente, o feed nao seria tocado e o lastBuildDate ficaria
      # congelado. Isso importa quando ha item com pubDate no futuro: na hora em que a
      # data chega, nada avisa o Spotify de que o estado mudou, e ele so descobre no
      # crawl de rotina seguinte, que pode ser horas depois.
      #
      # Regerar o feed nao muda conteudo nenhum, so o lastBuildDate. Isso muda ETag e
      # Last-Modified, que e o que provoca o refetch. Num programa diario, um commit
      # por dia e o esperado.
      - name: Renovar o feed para provocar releitura
        if: steps.check.outputs.tem == 'nao'
        run: |
          # com tres disparos por dia, renovar em todos encheria o historico de commits
          # iguais. Uma vez por dia basta para mexer no ETag.
          ULTIMA=$(grep -o '<lastBuildDate>[^<]*' feed.xml | sed 's/<lastBuildDate>//')
          IDADE=$(( ($(date +%s) - $(date -d "$ULTIMA" +%s)) / 3600 ))
          if [ "$IDADE" -lt 3 ]; then
            echo "::notice::Feed renovado ha ${IDADE}h. Nao renovo de novo."
            exit 0
          fi
          python scripts/publicar_feed.py
          git config user.name "COMPASSO"
          git config user.email "contato@compasso.capital"
          if git diff --quiet feed.xml; then
            echo "::notice::Feed sem alteracao, nada a commitar."
            exit 0
          fi
          git add feed.xml
          git commit -qm "renova o feed (sem episodio novo)"
          git push -q
          echo "::notice::lastBuildDate renovado: $(grep -o '<lastBuildDate>[^<]*' feed.xml)"

      - name: Avisar que o episodio entrou no ar
        if: success() && steps.check.outputs.tem == 'sim'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py feed ok "O episodio de ${{ steps.check.outputs.data }} entrou no feed e ja esta no Spotify. Ouca em https://galiciaeducacao.github.io/compasso-podcast/"

      - name: Avisar que nao havia episodio para publicar
        if: success() && steps.check.outputs.tem == 'nao'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py feed pulou "Nenhum episodio esperando publicacao. HOJE O PROGRAMA NAO SAI: a falha foi antes, na escrita ou na gravacao de ontem."

      - name: Avisar que a publicacao falhou
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py feed falhou "O episodio de ${{ steps.check.outputs.data }} NAO entrou no feed. O audio existe, so nao foi publicado. Log em ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
