# COMPASSO CAPITAL — publica o episodio no feed as 7h da manha.
#
# O audio ja esta no ar desde as 18h da vespera, como release. O que este workflow faz
# e acrescenta-lo ao FEED, e e isso que faz o episodio existir para o mundo: o Spotify,
# a Apple e os demais so enxergam o que esta no feed.
#
# Agendado para 6h45 de proposito: o agendador do GitHub costuma atrasar alguns minutos
# em horario cheio, e o compromisso com o ouvinte e 7h.
#
# Se nao houver episodio pendente, sai sem fazer nada.

name: publicar no feed (7h)

on:
  schedule:
    - cron: '45 9 * * *'      # 9h45 UTC = 6h45 de Brasilia
  workflow_dispatch:
    inputs:
      data:
        description: 'Data do episodio a publicar (AAAA-MM-DD). Vazio = hoje'
        required: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ha episodio pendente para hoje?
        id: check
        run: |
          DATA="${{ inputs.data }}"
          [ -z "$DATA" ] && DATA=$(TZ=America/Sao_Paulo date +%F)
          echo "data=$DATA" >> $GITHUB_OUTPUT
          if [ -f "pendentes/$DATA.json" ]; then
            echo "tem=sim" >> $GITHUB_OUTPUT
          else
            echo "tem=nao" >> $GITHUB_OUTPUT
            echo "::notice::Nenhum episodio pendente para $DATA."
          fi

      - name: Conferir que o audio esta mesmo no ar
        if: steps.check.outputs.tem == 'sim'
        run: |
          NUM=$(python -c "import json;print(json.load(open('pendentes/${{ steps.check.outputs.data }}.json'))['numero'])")
          TAG=$(printf "ep%04d" $NUM)
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$(printf 'compasso-capital-%04d.mp3' $NUM)"
          CODE=$(curl -sIL -o /dev/null -w "%{http_code}" "$URL")
          echo "audio em $URL responde $CODE"
          # publicar no feed um audio que nao baixa quebraria o episodio em todos os tocadores
          [ "$CODE" = "200" ] || { echo "::error::Audio inacessivel. Publicacao abortada."; exit 1; }

      - name: Acrescentar ao feed e publicar
        if: steps.check.outputs.tem == 'sim'
        run: |
          python - <<'FIM'
          import json, pathlib, subprocess, sys
          data = "${{ steps.check.outputs.data }}"
          p = json.loads(pathlib.Path(f"pendentes/{data}.json").read_text(encoding="utf-8"))
          roteiro = pathlib.Path(f"roteiros/{data}.md").read_text(encoding="utf-8")

          # titulo e resumo saem do proprio roteiro: primeira linha de titulo e a chamada
          titulo = f"{p['numero']}. " + next(
              (l.lstrip('# ').strip() for l in roteiro.splitlines()
               if l.startswith('# ') and 'COMPASSO' not in l.upper()),
              f"Episodio {p['numero']}")
          resumo = next((l.strip() for l in roteiro.splitlines()
                         if l.strip().startswith('> RESUMO:')), "")
          resumo = resumo.replace("> RESUMO:", "").strip() or \
                   "Cinco noticias que a imprensa brasileira nao conta direito. compasso.capital"

          subprocess.run([sys.executable, "scripts/publicar_feed.py", "--acrescentar",
                          str(p["numero"]), titulo, resumo, p["duracao"],
                          str(p["tamanho"]), f"{data}T07:00:00"], check=True)
          FIM
          git config user.name "COMPASSO"
          git config user.email "contato@compasso.capital"
          git rm -q "pendentes/${{ steps.check.outputs.data }}.json"
          git add feed.xml scripts/episodios.json
          git commit -m "no ar: episodio de ${{ steps.check.outputs.data }}"
          git push

      - name: Confirmar que o feed publicado ja tem o episodio
        if: steps.check.outputs.tem == 'sim'
        run: |
          sleep 60
          for i in 1 2 3 4 5 6; do
            if curl -s "https://galiciaeducacao.github.io/compasso-podcast/feed.xml" | grep -q "$(python -c "import json;print(json.load(open('scripts/episodios.json'))['episodios'][0]['guid'])")"; then
              echo "::notice::Episodio no ar no feed publico."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::O feed ainda nao propagou. Costuma resolver sozinho em minutos."

      # Enquanto o Spotify nao aprovar o cadastro, o episodio existe no feed e nao chega
      # a ninguem. Este aviso entrega o link direto do arquivo, que toca em qualquer lugar
      # e pode ser repassado a mao. Depois que a distribuicao estiver de pe, ele continua
      # util como confirmacao diaria de que a esteira rodou.
      #
      # Sem SMTP_USER/SMTP_PASS no repositorio, o passo avisa e sai: falta de aviso nao
      # pode derrubar uma publicacao que ja deu certo.
      - name: Avisar o Paulo que o episodio entrou no ar
        if: steps.check.outputs.tem == 'sim'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "::warning::Sem SMTP_USER/SMTP_PASS neste repositorio: nao enviei o aviso."
            exit 0
          fi
          python3 - <<'EOF'
          import json, os, pathlib, smtplib
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          ep = json.loads(pathlib.Path("scripts/episodios.json").read_text(encoding="utf-8"))["episodios"][0]
          DESTINO = "paulo@galiciaeducacao.edu.br"
          PAGINA = "https://galiciaeducacao.github.io/compasso-podcast/"
          FEED = PAGINA + "feed.xml"

          DIAS = ["segunda-feira", "terca-feira", "quarta-feira", "quinta-feira",
                  "sexta-feira", "sabado", "domingo"]
          MESES = ["janeiro", "fevereiro", "marco", "abril", "maio", "junho", "julho",
                   "agosto", "setembro", "outubro", "novembro", "dezembro"]
          agora = datetime.now(ZoneInfo("America/Sao_Paulo"))
          data_pt = "%s, %d de %s" % (DIAS[agora.weekday()], agora.day, MESES[agora.month - 1])

          def botao(url, solido, rotulo):
              estilo = ("background:#BA3520;color:#ffffff;" if solido
                        else "background:transparent;color:#D4573F;border:1px solid #BA3520;")
              return ('<a href="%s" style="display:inline-block;%s'
                      'text-decoration:none;font-family:Arial,Helvetica,sans-serif;'
                      'font-size:14px;font-weight:bold;letter-spacing:1px;'
                      'text-transform:uppercase;padding:14px 28px;border-radius:4px;'
                      'margin-right:8px;">%s</a>' % (url, estilo, rotulo))

          html = """
          <div style="background:#0F1416;padding:40px 24px;font-family:Georgia,'Times New Roman',serif;">
            <div style="max-width:560px;margin:0 auto;">
              <p style="color:#D4573F;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:bold;margin:0 0 14px;">Epis&oacute;dio %d &middot; no ar desde as 7h</p>
              <h1 style="color:#E9E5DC;font-weight:normal;font-size:34px;margin:0 0 18px;">COMPASSO <em style="color:#D4573F;">Capital</em></h1>
              <p style="color:#E9E5DC;font-size:16px;line-height:1.6;margin:0 0 12px;">paulo,</p>
              <p style="color:#E9E5DC;font-size:16px;line-height:1.6;margin:0 0 12px;">o epis&oacute;dio de %s entrou no feed, com %s de dura&ccedil;&atilde;o.</p>
              <p style="color:#E9E5DC;font-size:17px;line-height:1.5;margin:0 0 22px;font-style:italic;">%s</p>
              <p style="margin:0 0 32px;">%s%s</p>
              <p style="color:#9AA3A6;font-size:12px;line-height:1.6;border-top:1px solid #2a3237;padding-top:16px;margin:0;">O bot&atilde;o Ouvir agora abre o arquivo direto, que toca em qualquer lugar e pode ser repassado sem depender de plataforma. Endere&ccedil;o do feed para cadastro: %s</p>
            </div>
          </div>
          """ % (ep["numero"], data_pt, ep["duracao"][3:], ep["titulo"].split(". ", 1)[-1],
                 botao(ep["url"], True, "Ouvir agora"),
                 botao(PAGINA, False, "P&aacute;gina do programa"), FEED)

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "COMPASSO CAPITAL %d no ar (%s)" % (ep["numero"], data_pt)
          msg["From"] = "COMPASSO CAPITAL <%s>" % os.environ["SMTP_USER"]
          msg["To"] = DESTINO
          msg.attach(MIMEText("Episodio %d no ar: %s" % (ep["numero"], ep["url"]), "plain", "utf-8"))
          msg.attach(MIMEText(html, "html", "utf-8"))

          s = smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30)
          s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"])
          s.sendmail(os.environ["SMTP_USER"], [DESTINO], msg.as_string())
          s.quit()
          print("aviso enviado a " + DESTINO)
          EOF
