# COMPASSO CAPITAL — grava o episodio do dia seguinte, no fim da tarde.
#
# Roda nos servidores do GitHub: nao depende de nenhuma maquina ligada.
#
# TRES HORARIOS, NAO UM. O agendador do GitHub e best effort: em 27/08 o disparo das
# 18h saiu as 2h da manha, oito horas atrasado, e nos mesmos dois dias o guardiao e a
# publicacao das 7h simplesmente nao rodaram. Para um programa que promete estar no ar
# todo dia as 7h, um unico disparo por dia nao serve. As repeticoes so existem porque o
# alvo e deduzido do estado, entao disparo repetido nao gera episodio repetido.
#
# O QUE ELE GRAVA NAO SE CALCULA PELO RELOGIO. Ver scripts/proximo_episodio.py: o alvo
# e o primeiro dia, de hoje em diante, com roteiro aprovado e sem episodio gravado ou
# publicado. Assim disparo atrasado, repetido ou fora de hora acerta o mesmo alvo.
#
# O audio vira release, mas NAO entra no feed aqui. Quem publica e o workflow das 5h,
# para o episodio so existir para o mundo na hora combinada.

name: gerar audio (4h)

on:
  schedule:
    - cron: '0 7 * * *'       # 4h00 de Brasilia (regra do Paulo, 04/09: roteiro as 3h, gravacao as 4h, feed as 5h)
    - cron: '15 7 * * *'      # 4h15, se o primeiro nao rodar
    - cron: '30 7 * * *'      # 4h30, ultima tentativa antes da publicacao das 5h
  push:
    paths: ['ops/gravar-agora.txt']   # gatilho pontual: o cron do GitHub atrasa horas
  workflow_dispatch:
    inputs:
      data:
        description: 'Forcar a data do episodio (AAAA-MM-DD). Vazio = deduzir do estado'
        required: false
      numero:
        description: 'Forcar o numero do episodio. Vazio = proximo da sequencia'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qual episodio gravar
        id: alvo
        run: |
          if [ -n "${{ inputs.data }}" ]; then
            NUM="${{ inputs.numero }}"
            if [ -z "$NUM" ]; then
              NUM=$(python -c "import json;d=json.load(open('scripts/episodios.json'));print(max([e['numero'] for e in d['episodios']]+[0])+1)")
            fi
            echo "tem=sim" >> $GITHUB_OUTPUT
            echo "data=${{ inputs.data }}" >> $GITHUB_OUTPUT
            echo "numero=$NUM" >> $GITHUB_OUTPUT
            echo "Alvo forcado a mao: episodio $NUM para ${{ inputs.data }}"
          else
            python scripts/proximo_episodio.py
          fi

      # O ffmpeg NAO vem no runner do GitHub, e sem ele o gerador morre no primeiro
      # corte. Isso so apareceu em 30/08, quando o servidor tentou gravar pela primeira
      # vez de verdade: os episodios 1 e 2 foram gerados na maquina local, entao o passo
      # central da esteira nunca tinha rodado no ambiente onde precisa rodar.
      #
      # O passo anterior era `ffmpeg -version | head -1`, e o pipe TROCA o codigo de
      # saida pelo do head: a verificacao passava com o ffmpeg ausente. Verificacao que
      # nao pode falhar nao verifica nada.
      - name: Instalar o ffmpeg
        if: steps.alvo.outputs.tem == 'sim'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
          echo "ffmpeg e ffprobe prontos: $(ffmpeg -version | head -1)"

      - name: Gravar o audio
        id: audio
        if: steps.alvo.outputs.tem == 'sim'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/gerar_episodio.py "${{ steps.alvo.outputs.data }}" "${{ steps.alvo.outputs.numero }}"

      # O gerador pode terminar com EXITO e ainda entregar episodio quebrado: bloco
      # truncado pela API, corte de priming no lugar errado deixando fala repetida,
      # mixagem muda. Nada disso levanta excecao. Este passo transcreve o audio e
      # compara com o roteiro, unico jeito de saber que o que foi escrito foi dito.
      # Se reprovar, o job para AQUI e nao existe release: melhor dia sem episodio do
      # que episodio quebrado no ar.
      - name: QA do audio antes de publicar
        if: steps.audio.outputs.gerou == 'sim'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/qa_audio.py "${{ steps.audio.outputs.arquivo }}" "${{ steps.alvo.outputs.data }}"

      - name: Publicar o audio como release
        if: steps.audio.outputs.gerou == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(printf "ep%04d" ${{ steps.alvo.outputs.numero }})
          gh release create "$TAG" "${{ steps.audio.outputs.arquivo }}" \
            --title "Episodio ${{ steps.alvo.outputs.numero }}" \
            --notes "COMPASSO CAPITAL, ${{ steps.alvo.outputs.data }}. compasso.capital"

      # O release acima e backup e historico. QUEM TOCA E O R2: o release responde
      # Content-Type octet-stream com Content-Disposition attachment, e o player da
      # Apple recusa ("este episodio nao pode ser reproduzido neste dispositivo",
      # 01/09). Ver scripts/subir_audio.py para o diagnostico completo.
      - name: Poe o audio no ar em audio.compasso.capital
        if: steps.audio.outputs.gerou == 'sim'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::warning::sem credencial do R2: o episodio sai pelo release, toca no"
            echo "::warning::Spotify e fica MUDO NA APPLE. Decisao do Paulo em 01/09, para"
            echo "::warning::nao perder dia de programa enquanto o balde nao existe."
            exit 0
          fi
          pip install --quiet boto3
          python scripts/subir_audio.py "${{ steps.audio.outputs.arquivo }}" \
            "$(printf 'compasso-capital-%04d.mp3' ${{ steps.alvo.outputs.numero }})"

      - name: Guardar os dados para a publicacao das 7h
        if: steps.audio.outputs.gerou == 'sim'
        run: |
          mkdir -p pendentes
          cat > "pendentes/${{ steps.alvo.outputs.data }}.json" <<FIM
          {
            "numero": ${{ steps.alvo.outputs.numero }},
            "data": "${{ steps.alvo.outputs.data }}",
            "duracao": "${{ steps.audio.outputs.duracao }}",
            "tamanho": ${{ steps.audio.outputs.tamanho }}
          }
          FIM
          git config user.name "COMPASSO"
          git config user.email "contato@compasso.capital"
          git add pendentes
          git commit -m "audio do episodio ${{ steps.alvo.outputs.numero }} pronto, aguardando as 7h"
          git push

      - name: Avisar que a gravacao deu certo
        if: steps.audio.outputs.gerou == 'sim'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py audio ok "Episodio ${{ steps.alvo.outputs.numero }} de ${{ steps.alvo.outputs.data }} gravado e aprovado no QA. Duracao ${{ steps.audio.outputs.duracao }}. Entra no feed as 5h e vai ao ar as 7h."

      - name: Avisar que nao havia o que gravar
        if: steps.alvo.outputs.tem != 'sim'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py audio pulou "Nenhum roteiro aprovado esperando gravacao. Se voce esperava episodio amanha, o passo das 15h30 nao entregou."

      - name: Avisar que a gravacao falhou
        if: failure() && steps.alvo.outputs.tem == 'sim'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/avisar.py audio falhou "O episodio ${{ steps.alvo.outputs.numero }} de ${{ steps.alvo.outputs.data }} NAO foi gravado. Nada entrou no feed, entao nao ha nada quebrado no ar. Log em ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Dia sem episodio nunca pode acontecer em silencio: ninguem investiga o que nao
      # viu. Se a gravacao ou o QA falhou, abre issue e o GitHub avisa por e-mail.
      - name: Avisar que hoje nao tem episodio, e por que
        if: failure() && steps.alvo.outputs.tem == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Sem episodio em ${{ steps.alvo.outputs.data }}: a gravacao ou o QA falhou" --body "O episodio ${{ steps.alvo.outputs.numero }} de **${{ steps.alvo.outputs.data }}** **nao foi publicado**.

          O roteiro existia e tinha passado pelo guardiao, entao a falha esta na gravacao
          do audio ou no QA que roda logo depois dela.

          **O motivo exato esta no log da execucao**, nas linhas marcadas como error:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Nenhum release foi criado e nada entrou no feed, entao nao ha nada quebrado no
          ar: o episodio simplesmente nao existe. Para tentar de novo depois de corrigir:

              gh workflow run gerar-audio.yml -f data=${{ steps.alvo.outputs.data }}"
